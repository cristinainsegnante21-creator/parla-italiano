<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parla Italiano - Al bar</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 8px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      font-size: 25px;
      margin: 3px 0;
    }

    .subtitle {
      color: #666;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .turn {
      display: inline-block;
      background: #e0e0e0;
      color: #555;
      border-radius: 20px;
      padding: 5px 12px;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
    }

    .barista {
      background: white;
      border-radius: 18px;
      padding: 8px 12px;
      margin-bottom: 8px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);

      transition:
        transform 0.3s ease,
        opacity 0.3s ease;
    }

    .barista.change {
      transform: scale(0.96);
      opacity: 0.4;
    }

    .face {
      font-size: 48px;
      margin-bottom: 2px;
    }

    .barista-label {
      font-weight: bold;
      color: #555;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .speech {
      font-size: 19px;
      line-height: 1.2;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #listenButton {
      background: #ffd54f;
      color: #222;
      margin-top: 8px;
      font-size: 16px;
      padding: 9px 18px;
    }

    .student {
      background: #e7f3ff;
      border: 2px solid #b9ddff;
      border-radius: 18px;
      padding: 8px 12px;
      margin-bottom: 8px;

      transition:
        background 0.3s ease,
        border-color 0.3s ease;
    }

    .student.ready {
      background: #e8f8ed;
      border-color: #9bd5ad;
    }

    .student-label {
      font-size: 15px;
      font-weight: bold;
      color: #245;
      margin-bottom: 5px;
    }

    .your-turn {
      font-size: 18px;
      font-weight: bold;
      color: #16833b;
      margin-bottom: 7px;
    }

    #studentText {
      font-size: 17px;
      min-height: 26px;
      line-height: 1.3;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 12px 20px;
      margin: 4px;
      font-size: 17px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #speakButton {
      background: #4caf50;
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 25px;
      width: 90%;
      max-width: 350px;
    }

    #speakButton:active {
      transform: scale(0.97);
    }

    #speakButton:disabled {
      background: #aaa;
    }

    #helpButton {
  background: #ff9800;
  color: white;
  display: none;
  font-size: 18px;
  padding: 12px 20px;
}
    
    #nextButton {
      background: #2196f3;
      color: white;
      display: none;
      font-size: 19px;
      padding: 14px 25px;
    }

    .status {
      margin: 8px 0;
      font-size: 16px;
      color: #555;
      min-height: 22px;
    }

    .feedback {
      background: #fff8d8;
      border-radius: 16px;
      padding: 10px;
      margin-top: 8px;
      display: none;
      font-size: 16px;
    }

    .finished {
      background: #e8f5e9;
      border: 2px solid #81c784;
      border-radius: 20px;
      padding: 15px;
      margin-top: 10px;
      display: none;
    }

    .finished-title {
      font-size: 22px;
      font-weight: bold;
      color: #2e7d32;
    }

    .finished-text {
      font-size: 17px;
      margin-top: 6px;
    }

    .new-turn {
      animation: newTurn 0.5s ease;
    }

    @keyframes newTurn {

      0% {
        opacity: 0;
        transform: translateY(15px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @media (max-width: 480px) {

      body {
        padding: 8px;
      }

      h1 {
        font-size: 25px;
      }

      .speech {
        font-size: 19px;
      }

      .face {
        font-size: 48px;
      }

      #speakButton {
        width: 90%;
        padding: 14px 20px;
      }

    }

  </style>
</head>


<body>

<div class="container">

  <h1>☕ Al bar</h1>

  <div class="subtitle">
    Parla con il barista
  </div>

  <div id="counter" class="turn">
    Turno 1 di 5
  </div>


  <div id="baristaBox" class="barista">

    <div id="baristaFace" class="face">
      😊
    </div>

    <div class="barista-label">
      BARISTA
    </div>

    <div id="baristaSpeech" class="speech">
      Buongiorno! Cosa desidera?
    </div>

    <button id="listenButton">
      🔊 ASCOLTA
    </button>

  </div>


  <div id="studentBox" class="student ready">

    <div class="student-label">
      TU
    </div>

    <div class="your-turn">
      💬 Ora tocca a te!
    </div>

    <div id="studentText">
      Rispondi al barista.
    </div>

  </div>


  <button id="speakButton">
    🎤 PARLA
  </button>

 <button id="helpButton">
  🆘 AIUTO
</button>

  <button id="nextButton">
    🔄 RICOMINCIA
  </button>


  <div id="status" class="status">
  </div>


  <div id="feedbackBox" class="feedback">
    <div id="feedbackText"></div>
  </div>


  <div id="finishedBox" class="finished">

    <div class="finished-title">
      🎉 Bravissimo!
    </div>

    <div class="finished-text">
      Hai completato la conversazione al bar.
    </div>

  </div>


</div>


<script>


/* ==================================================
   COLLEGAMENTO CON IL WORKER AI
================================================== */

const WORKER_URL =
  "https://parla-italiano.cristina-insegnante-21.workers.dev/";


/* ==================================================
   RICONOSCIMENTO VOCALE
================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* ==================================================
   ELEMENTI DELLA PAGINA
================================================== */

const baristaBox =
  document.getElementById("baristaBox");

const baristaFace =
  document.getElementById("baristaFace");

const baristaSpeech =
  document.getElementById("baristaSpeech");

const studentBox =
  document.getElementById("studentBox");

const studentText =
  document.getElementById("studentText");

const speakButton =
  document.getElementById("speakButton");

const listenButton =
  document.getElementById("listenButton");

const nextButton =
  document.getElementById("nextButton");

const helpButton =
  document.getElementById("helpButton");

 helpButton.addEventListener("click", async function() {

  statusBox.innerText =
    "💡 Sto preparando un suggerimento...";

  helpButton.disabled =
    true;

  let context = "";

  conversationHistory.forEach(function(item) {

    if (item.role === "assistant") {

      context +=
        "BARISTA: " +
        item.content +
        "\n";

    } else {

      context +=
        "STUDENTE: " +
        item.content +
        "\n";

    }

  });

  try {

    const response =
      await fetch(WORKER_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message:
            "Scenario: lo studente sta parlando con un barista italiano.\n\n" +
            "Conversazione:\n" +
            context +
            "\n\n" +
            "Lo studente è in difficoltà e ha bisogno di aiuto. " +
            "Suggerisci UNA sola frase breve e naturale che lo studente può dire ADESSO al barista. " +
            "La frase deve essere semplice, in prima persona e pronta da pronunciare. " +
            "Deve essere coerente con la conversazione. " +
            "Non spiegare la grammatica. " +
            "Non usare virgolette, asterischi o etichette. " +
            "Rispondi solo con la frase che lo studente può dire."

        })

      });

    if (!response.ok) {

      throw new Error(
        "Errore HTTP: " +
        response.status
      );

    }

    let suggestion =
      await response.text();

    suggestion =
      suggestion
        .replace(/\*\*/g, "")
        .replace(/\*/g, "")
        .trim();

    feedbackText.innerText =
      "💡" +
      suggestion;

    feedbackBox.style.display =
      "block";

    statusBox.innerText =
      "💡 Puoi dire:";

    speakText(suggestion);

    helpButton.disabled =
      false;

  } catch (error) {

    console.error(error);

    statusBox.innerText =
      "⚠️ Non riesco a preparare il suggerimento.";

    helpButton.disabled =
      false;

  }

});

const statusBox =
  document.getElementById("status");

const feedbackBox =
  document.getElementById("feedbackBox");

const feedbackText =
  document.getElementById("feedbackText");

const counter =
  document.getElementById("counter");

const finishedBox =
  document.getElementById("finishedBox");


/* ==================================================
   STATO
================================================== */

const totalTurns = 5;

let currentTurn = 0;

let attemptCount = 0;

let currentBaristaSpeech =
  "Buongiorno! Cosa desidera?";


/*
 * Conserviamo le frasi della conversazione
 * per dare all'AI un po' di contesto.
 */

let conversationHistory = [
  {
    role: "assistant",
    content: currentBaristaSpeech
  }
];


/* ==================================================
   SINTESI VOCALE
================================================== */

function speakText(text) {

  if (!("speechSynthesis" in window)) {

    statusBox.innerText =
      "La sintesi vocale non è disponibile.";

    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "it-IT";

  utterance.rate = 0.9;

  utterance.pitch = 1;

  window.speechSynthesis.speak(utterance);
}


/* ==================================================
   ASCOLTA IL BARISTA
================================================== */

listenButton.addEventListener("click", function() {

  speakText(currentBaristaSpeech);

});


/* ==================================================
   CHIAMATA ALL'AI
================================================== */

async function askBarista(studentMessage) {

  /*
   * Creiamo un messaggio con il contesto
   * della conversazione.
   */

  let context = "";

  conversationHistory.forEach(function(item) {

    if (item.role === "assistant") {

      context += "BARISTA: " +
        item.content +
        "\n";

    } else {

      context += "STUDENTE: " +
        item.content +
        "\n";

    }

  });


  context +=
    "STUDENTE: " +
    studentMessage;


  try {

    const response =
      await fetch(WORKER_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message:
            "Scenario: lo studente sta parlando con un barista in un bar italiano.\n\n" +
            "Conversazione fino a questo momento:\n" +
            context +
            "\n\n" +
            "Rispondi come un barista italiano gentile. " +
            "Usa un italiano semplice, naturale e adatto a uno studente. " +
            "Continua la conversazione in modo coerente. " +
            "Se la frase dello studente contiene una parola poco chiara, insolita o probabilmente pronunciata male, NON bloccarti e NON inventare il significato. " +
            "Chiedi semplicemente: 'Mi scusi, non ho capito. Può ripetere, per favore?' " +
            "Se capisci abbastanza bene il significato, continua normalmente la conversazione. " +
            "Se correggi una parola, fallo molto brevemente e poi continua. " +
            "NON usare asterischi, markdown, virgolette speciali o simboli per evidenziare le parole. " +
            "Non dare spiegazioni grammaticali lunghe. " +
            "Rispondi in modo breve, come farebbe un vero barista."
        })

      });


    if (!response.ok) {

      throw new Error(
        "Errore HTTP: " + response.status
      );

    }


    let reply =
      await response.text();

reply = reply
  .replace(/\*\*/g, "")
  .replace(/\*/g, "")
  .trim();


    return reply.trim();


  } catch (error) {

    console.error(error);

    return null;

  }

}


/* ==================================================
   MOSTRA LA RISPOSTA DEL BARISTA
================================================== */

function showBaristaReply(reply) {

  currentBaristaSpeech =
    reply;

  baristaSpeech.innerText =
    reply;

  baristaFace.innerText =
    "😊";


  baristaBox.classList.remove("new-turn");

  void baristaBox.offsetWidth;

  baristaBox.classList.add("new-turn");


  counter.innerText =
    "Turno " +
    (currentTurn + 1) +
    " di " +
    totalTurns;


  statusBox.innerText =
    "💬 Ora tocca a te!";


  studentBox.classList.add("ready");


  speakButton.disabled =
    false;


  /*
   * Il barista parla automaticamente.
   */

  setTimeout(function() {

    speakText(reply);

  }, 300);

}


/* ==================================================
   GESTIONE DELLA RISPOSTA DELLO STUDENTE
================================================== */

async function processStudentMessage(text) {

  studentText.innerText =
    "« " + text + " »";


  statusBox.innerText =
    "🤖 Il barista sta pensando...";


  speakButton.disabled =
    true;


  listenButton.disabled =
    true;


  studentBox.classList.remove("ready");


  /*
   * Salviamo la frase dello studente.
   */

  conversationHistory.push({
    role: "user",
    content: text
  });


  /*
   * Chiediamo la risposta all'AI.
   */

  const reply =
  await askBarista(text);

if (!reply) {

  statusBox.innerText =
    "⚠️ Non riesco a collegarmi al barista. Prova ancora.";

  speakButton.disabled =
    false;

  listenButton.disabled =
    false;

  studentBox.classList.add("ready");

  return;
}

const didNotUnderstand =
  reply.toLowerCase().includes("non ho capito");

if (didNotUnderstand) {

  attemptCount++;
  
  
  console.log(
    "Tentativi non capiti:",
    attemptCount
  );

  if (attemptCount >= 2) {

    helpButton.style.display =
      "inline-block";

  }

} else {

  attemptCount = 0;

  helpButton.style.display =
    "none";
}
  /*
   * Se qualcosa è andato storto.
   */

  if (!reply) {

    statusBox.innerText =
      "⚠️ Non riesco a collegarmi al barista. Prova ancora.";

    speakButton.disabled =
      false;

    listenButton.disabled =
      false;

    studentBox.classList.add("ready");

    return;

  }


  /*
   * Salviamo la risposta del barista.
   */

  conversationHistory.push({
    role: "assistant",
    content: reply
  });


  /*
   * Feedback semplice.
   */

  feedbackText.innerText =
    "👍 Il barista ha capito e continua la conversazione.";

  feedbackBox.style.display =
    "block";


  /*
   * Passiamo al turno successivo.
   */

  currentTurn++;


  /*
   * Ci sono ancora turni.
   */

  if (currentTurn < totalTurns) {

    setTimeout(function() {

      listenButton.disabled =
        false;

      showBaristaReply(reply);

    }, 500);

  }


  /*
   * Fine dei 5 turni.
   */

  else {

    setTimeout(function() {

      showBaristaReply(reply);

      counter.innerText =
        "🎉 Conversazione completata";

      statusBox.innerText =
        "Hai finito la conversazione!";

      studentText.innerText =
        "Bravissimo!";

      studentBox.classList.remove("ready");

      finishedBox.style.display =
        "block";

      speakButton.disabled =
        true;

      nextButton.style.display =
        "inline-block";

      listenButton.disabled =
        false;

    }, 500);

  }

}


/* ==================================================
   RICONOSCIMENTO VOCALE
================================================== */

if (!SpeechRecognition) {

  speakButton.disabled = true;

  statusBox.innerText =
    "Il riconoscimento vocale non è disponibile su questo browser.";

} else {

  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "it-IT";


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  /* ----------------------------------------------
     INIZIO ASCOLTO
  ---------------------------------------------- */

  recognition.onstart = function() {

    statusBox.innerText =
      "🎤 Sto ascoltando... Parla adesso.";

    speakButton.disabled =
      true;

    feedbackBox.style.display =
      "none";

    helpButton.style.display =
    "none";

    studentBox.classList.remove("ready");

  };


  /* ----------------------------------------------
     RISPOSTA DELLO STUDENTE
  ---------------------------------------------- */

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript.trim();

    console.log("Trascrizione:", text)

    if (text === "") {

      statusBox.innerText =
         "🤔 Non ho capito. Puoi ripetere, per favore?";

      speakButton.disabled =
        false;

      studentBox.classList.add("ready");

      return;

    }


    processStudentMessage(text);

  };


  /* ----------------------------------------------
     ERRORI
  ---------------------------------------------- */

recognition.onerror = function(event) {

  console.log(event.error);

  if (event.error === "not-allowed") {

    statusBox.innerText =
      "⚠️ Devi permettere l'accesso al microfono.";

    speakButton.disabled = false;
    return;
  }

  else if (
    event.error === "no-speech" ||
    event.error === "audio-capture" ||
    event.error === "network"
  ) {

    statusBox.innerText =
      "🤔 Non ho capito. Puoi ripetere, per favore?";

    speakButton.disabled = false;

    setTimeout(function() {
      speakButton.click();
    }, 800);

    return;
  }

  else {

    statusBox.innerText =
      "Si è verificato un problema. Prova ancora.";

  }

  speakButton.disabled =
    false;

    studentBox.classList.add("ready");

  };


  /* ----------------------------------------------
     FINE ASCOLTO
  ---------------------------------------------- */

  recognition.onend = function() {
  /*
   * Il riconoscimento vocale è terminato.
   * Se non abbiamo ricevuto un risultato,
   * rendiamo nuovamente disponibile il pulsante.
   */

  if (speakButton.disabled) {

    speakButton.disabled = false;

    statusBox.innerText =
      "🤔 Mi scusi, non ho capito. Può ripetere, per favore?";

    speakText(
      "Mi scusi, non ho capito. Può ripetere, per favore?"
    );

    studentBox.classList.add("ready");

  }

};


  /* ----------------------------------------------
     PULSANTE PARLA
  ---------------------------------------------- */

  speakButton.addEventListener("click", function() {

    feedbackBox.style.display =
      "none";


    statusBox.innerText =
      "🎤 Preparati a parlare...";


    try {

      recognition.start();

    } catch (error) {

      console.log(error);

    }

  });

}


/* ==================================================
   RICOMINCIA
================================================== */

nextButton.addEventListener("click", function() {

  currentTurn = 0;


  currentBaristaSpeech =
    "Buongiorno! Cosa desidera?";


  conversationHistory = [
    {
      role: "assistant",
      content: currentBaristaSpeech
    }
  ];


  /* Barista */

  baristaFace.innerText =
    "😊";

  baristaSpeech.innerText =
    currentBaristaSpeech;


  /* Studente */

  studentText.innerText =
    "Rispondi al barista.";

  studentBox.classList.add("ready");


  /* Turno */

  counter.innerText =
    "Turno 1 di " +
    totalTurns;


  /* Stato */

  statusBox.innerText =
    "💬 Ora tocca a te!";


  /* Feedback */

  feedbackBox.style.display =
    "none";


  /* Fine */

  finishedBox.style.display =
    "none";


  /* Pulsanti */

  nextButton.style.display =
    "none";

  speakButton.disabled =
    false;

  listenButton.disabled =
    false;


  /*
   * Il barista riparte.
   */

  setTimeout(function() {

    speakText(currentBaristaSpeech);

  }, 300);

});


/* ==================================================
   AVVIO AUTOMATICO DELLA VOCE DEL BARISTA
================================================== */

window.addEventListener("load", function() {

  setTimeout(function() {

    speakText(currentBaristaSpeech);

  }, 500);

});


</script>

</body>
</html>
