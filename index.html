<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parla Italiano - Al bar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .barista {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .face {
      font-size: 70px;
      margin-bottom: 10px;
    }

    .barista-label {
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
    }

    .speech {
      font-size: 22px;
      line-height: 1.4;
    }

    .student {
      background: #e8f4ff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .student-label {
      font-weight: bold;
      color: #357;
      margin-bottom: 10px;
    }

    #studentText {
      font-size: 20px;
      min-height: 30px;
    }

    button {
      border: none;
      border-radius: 15px;
      padding: 16px 22px;
      margin: 7px;
      font-size: 18px;
      cursor: pointer;
    }

    #listenButton {
      background: #ffd54f;
    }

    #speakButton {
      background: #4caf50;
      color: white;
      font-size: 21px;
      padding: 18px 30px;
    }

    #speakButton:disabled {
      background: #aaa;
    }

    #nextButton {
      background: #2196f3;
      color: white;
      display: none;
    }

    .status {
      margin: 15px 0;
      font-size: 17px;
      color: #555;
      min-height: 25px;
    }

    .feedback {
      background: #fff8d8;
      border-radius: 15px;
      padding: 15px;
      margin-top: 15px;
      display: none;
      font-size: 18px;
    }

    .counter {
      color: #777;
      font-size: 15px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>☕ Al bar</h1>

  <div class="subtitle">
    Parla con il barista
  </div>


  <!-- =========================
       BARISTA
  ========================== -->

  <div class="barista">

    <div id="baristaFace" class="face">
      😊
    </div>

    <div class="barista-label">
      BARISTA
    </div>

    <div id="baristaSpeech" class="speech">
      Buongiorno! Cosa desidera?
    </div>

    <button id="listenButton">
      🔊 ASCOLTA
    </button>

  </div>


  <!-- =========================
       STUDENTE
  ========================== -->

  <div class="student">

    <div class="student-label">
      TU
    </div>

    <div id="studentText">
      Premi PARLA e rispondi al barista.
    </div>

  </div>


  <!-- =========================
       CONTROLLI
  ========================== -->

  <button id="speakButton">
    🎤 PARLA
  </button>

  <button id="nextButton">
    ➡️ CONTINUA
  </button>


  <div id="status" class="status">
  </div>


  <!-- =========================
       FEEDBACK
  ========================== -->

  <div id="feedbackBox" class="feedback">
    <div id="feedbackText"></div>
  </div>


  <div id="counter" class="counter">
    Turno 1
  </div>

</div>


<script>


/* ==================================================
   CONFIGURAZIONE
================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* ==================================================
   ELEMENTI DELLA PAGINA
================================================== */

const baristaFace =
  document.getElementById("baristaFace");

const baristaSpeech =
  document.getElementById("baristaSpeech");

const studentText =
  document.getElementById("studentText");

const speakButton =
  document.getElementById("speakButton");

const listenButton =
  document.getElementById("listenButton");

const nextButton =
  document.getElementById("nextButton");

const statusBox =
  document.getElementById("status");

const feedbackBox =
  document.getElementById("feedbackBox");

const feedbackText =
  document.getElementById("feedbackText");

const counter =
  document.getElementById("counter");


/* ==================================================
   CONVERSAZIONE
================================================== */

const conversation = [

  {
    barista: "Buongiorno! Cosa desidera?",
    feedback: "Bene! Hai risposto al barista. 👍"
  },

  {
    barista: "Certo! Desidera anche qualcosa da mangiare?",
    feedback: "Molto bene! Il barista continua la conversazione. 👍"
  },

  {
    barista: "Preferisce un cornetto alla crema o alla marmellata?",
    feedback: "Perfetto! Ora puoi scegliere. 👍"
  },

  {
    barista: "Va bene. Sono 3 euro, per favore.",
    feedback: "Benissimo! Il barista ti dice il prezzo. 💶"
  },

  {
    barista: "Grazie! Buona giornata!",
    feedback: "Conversazione completata! 🎉"
  }

];


/* ==================================================
   STATO DELLA CONVERSAZIONE
================================================== */

let currentTurn = 0;

let currentBaristaSpeech =
  conversation[0].barista;


/* ==================================================
   SINTESI VOCALE
================================================== */

function speakText(text) {

  if (!("speechSynthesis" in window)) {
    statusBox.innerText =
      "La sintesi vocale non è disponibile.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "it-IT";

  utterance.rate = 0.9;

  utterance.pitch = 1;

  window.speechSynthesis.speak(utterance);
}


/* ==================================================
   PULSANTE ASCOLTA
================================================== */

listenButton.addEventListener("click", function() {

  speakText(currentBaristaSpeech);

});


/* ==================================================
   RICONOSCIMENTO VOCALE
================================================== */

if (!SpeechRecognition) {

  speakButton.disabled = true;

  statusBox.innerText =
    "Il riconoscimento vocale non è disponibile su questo browser.";

} else {

  const recognition =
    new SpeechRecognition();

  recognition.lang = "it-IT";

  recognition.interimResults = false;

  recognition.continuous = false;


  /* ----------------------------------------------
     QUANDO INIZIA AD ASCOLTARE
  ---------------------------------------------- */

  recognition.onstart = function() {

    statusBox.innerText =
      "🎤 Sto ascoltando... Parla adesso.";

    speakButton.disabled = true;

    feedbackBox.style.display = "none";

  };


  /* ----------------------------------------------
     QUANDO RICEVE LA RISPOSTA
  ---------------------------------------------- */

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript.trim();


    if (text === "") {

      statusBox.innerText =
        "Non ho sentito. Prova ancora.";

      speakButton.disabled = false;

      return;
    }


    /* Mostra quello che ha detto lo studente */

    studentText.innerText =
      "« " + text + " »";


    statusBox.innerText =
      "✅ Ho sentito la tua risposta.";


    /* Mostra un piccolo feedback */

    feedbackText.innerText =
      conversation[currentTurn].feedback;

    feedbackBox.style.display =
      "block";


    /* ------------------------------------------
       PASSA AL TURNO SUCCESSIVO
    ------------------------------------------ */

    currentTurn++;


    if (currentTurn < conversation.length) {

      currentBaristaSpeech =
        conversation[currentTurn].barista;


      baristaFace.innerText =
        "😊";


      baristaSpeech.innerText =
        currentBaristaSpeech;


      counter.innerText =
        "Turno " + (currentTurn + 1);


      /* Il barista ha risposto.
         Ora lo studente può parlare di nuovo. */

      speakButton.disabled = false;


    } else {

      /* ----------------------------------------
         FINE CONVERSAZIONE
      ---------------------------------------- */

      baristaFace.innerText =
        "😊";

      baristaSpeech.innerText =
        "Grazie! Buona giornata!";

      currentBaristaSpeech =
        "Grazie! Buona giornata!";

      counter.innerText =
        "Conversazione completata 🎉";

      statusBox.innerText =
        "🎉 Hai completato la conversazione!";

      speakButton.disabled = true;

      nextButton.style.display =
        "inline-block";

    }

  };


  /* ----------------------------------------------
     ERRORE
  ---------------------------------------------- */

  recognition.onerror = function(event) {

    console.log(event.error);

    if (event.error === "not-allowed") {

      statusBox.innerText =
        "⚠️ Devi permettere l'accesso al microfono.";

    } else if (event.error === "no-speech") {

      statusBox.innerText =
        "Non ho sentito. Prova a parlare di nuovo.";

    } else {

      statusBox.innerText =
        "Si è verificato un problema. Prova ancora.";

    }

    speakButton.disabled = false;

  };


  /* ----------------------------------------------
     FINE ASCOLTO
  ---------------------------------------------- */

  recognition.onend = function() {

    if (currentTurn < conversation.length) {

      speakButton.disabled = false;

    }

  };


  /* ----------------------------------------------
     PULSANTE PARLA
  ---------------------------------------------- */

  speakButton.addEventListener("click", function() {

    feedbackBox.style.display =
      "none";

    statusBox.innerText =
      "🎤 Preparati a parlare...";

    recognition.start();

  });

}


/* ==================================================
   PULSANTE CONTINUA / RICOMINCIA
================================================== */

nextButton.addEventListener("click", function() {

  currentTurn = 0;

  currentBaristaSpeech =
    conversation[0].barista;

  baristaFace.innerText =
    "😊";

  baristaSpeech.innerText =
    currentBaristaSpeech;

  studentText.innerText =
    "Premi PARLA e rispondi al barista.";

  statusBox.innerText =
    "";

  feedbackBox.style.display =
    "none";

  counter.innerText =
    "Turno 1";

  nextButton.style.display =
    "none";

  speakButton.disabled =
    false;

});


</script>

</body>
</html>
