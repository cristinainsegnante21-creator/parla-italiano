<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parla Italiano - Al bar</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    /* =========================
       TITOLO
    ========================== */

    h1 {
      font-size: 30px;
      margin: 5px 0;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
      font-size: 17px;
    }


    /* =========================
       INDICATORE TURNO
    ========================== */

    .turn {
      display: inline-block;
      background: #e0e0e0;
      color: #555;
      border-radius: 20px;
      padding: 8px 16px;
      margin-bottom: 15px;
      font-size: 15px;
      font-weight: bold;
    }


    /* =========================
       AREA BARISTA
    ========================== */

    .barista {
      background: white;
      border-radius: 22px;
      padding: 25px 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);

      transition:
        transform 0.3s ease,
        opacity 0.3s ease;
    }

    .barista.change {
      transform: scale(0.96);
      opacity: 0.4;
    }

    .face {
      font-size: 75px;
      margin-bottom: 8px;
    }

    .barista-label {
      font-weight: bold;
      color: #555;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .speech {
      font-size: 23px;
      line-height: 1.4;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* =========================
       PULSANTE ASCOLTA
    ========================== */

    #listenButton {
      background: #ffd54f;
      color: #222;
      margin-top: 15px;
    }


    /* =========================
       AREA STUDENTE
    ========================== */

    .student {
      background: #e7f3ff;
      border: 2px solid #b9ddff;
      border-radius: 22px;
      padding: 22px 18px;
      margin-bottom: 18px;

      transition:
        background 0.3s ease,
        border-color 0.3s ease;
    }

    .student.ready {
      background: #e8f8ed;
      border-color: #9bd5ad;
    }

    .student-label {
      font-size: 18px;
      font-weight: bold;
      color: #245;
      margin-bottom: 8px;
    }

    .your-turn {
      font-size: 22px;
      font-weight: bold;
      color: #16833b;
      margin-bottom: 12px;
    }

    #studentText {
      font-size: 19px;
      min-height: 30px;
      line-height: 1.4;
    }


    /* =========================
       PULSANTI
    ========================== */

    button {
      border: none;
      border-radius: 16px;
      padding: 16px 22px;
      margin: 6px;
      font-size: 18px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #listenButton {
      font-size: 18px;
    }

    #speakButton {
      background: #4caf50;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 19px 35px;
      width: 85%;
      max-width: 350px;
    }

    #speakButton:active {
      transform: scale(0.97);
    }

    #speakButton:disabled {
      background: #aaa;
    }

    #nextButton {
      background: #2196f3;
      color: white;
      display: none;
      font-size: 20px;
      padding: 17px 28px;
    }


    /* =========================
       STATO
    ========================== */

    .status {
      margin: 15px 0;
      font-size: 17px;
      color: #555;
      min-height: 25px;
    }


    /* =========================
       FEEDBACK
    ========================== */

    .feedback {
      background: #fff8d8;
      border-radius: 16px;
      padding: 15px;
      margin-top: 15px;
      display: none;
      font-size: 18px;
    }


    /* =========================
       FINE CONVERSAZIONE
    ========================== */

    .finished {
      background: #e8f5e9;
      border: 2px solid #81c784;
      border-radius: 20px;
      padding: 20px;
      margin-top: 15px;
      display: none;
    }

    .finished-title {
      font-size: 24px;
      font-weight: bold;
      color: #2e7d32;
    }

    .finished-text {
      font-size: 18px;
      margin-top: 8px;
    }


    /* =========================
       ANIMAZIONE CAMBIO TURNO
    ========================== */

    .new-turn {
      animation: newTurn 0.5s ease;
    }

    @keyframes newTurn {

      0% {
        opacity: 0;
        transform: translateY(15px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      h1 {
        font-size: 27px;
      }

      .speech {
        font-size: 21px;
      }

      .face {
        font-size: 65px;
      }

      #speakButton {
        width: 90%;
      }

    }

  </style>
</head>


<body>

<div class="container">


  <!-- =========================
       TITOLO
  ========================== -->

  <h1>☕ Al bar</h1>

  <div class="subtitle">
    Parla con il barista
  </div>


  <!-- =========================
       TURNO
  ========================== -->

  <div id="counter" class="turn">
    Turno 1 di 5
  </div>


  <!-- =========================
       BARISTA
  ========================== -->

  <div id="baristaBox" class="barista">

    <div id="baristaFace" class="face">
      😊
    </div>

    <div class="barista-label">
      BARISTA
    </div>

    <div id="baristaSpeech" class="speech">
      Buongiorno! Cosa desidera?
    </div>

    <button id="listenButton">
      🔊 ASCOLTA
    </button>

  </div>


  <!-- =========================
       STUDENTE
  ========================== -->

  <div id="studentBox" class="student ready">

    <div class="student-label">
      TU
    </div>

    <div class="your-turn">
      💬 Ora tocca a te!
    </div>

    <div id="studentText">
      Rispondi al barista.
    </div>

  </div>


  <!-- =========================
       PARLA
  ========================== -->

  <button id="speakButton">
    🎤 PARLA
  </button>


  <!-- =========================
       CONTINUA
  ========================== -->

  <button id="nextButton">
    🔄 RICOMINCIA
  </button>


  <!-- =========================
       STATO
  ========================== -->

  <div id="status" class="status">
  </div>


  <!-- =========================
       FEEDBACK
  ========================== -->

  <div id="feedbackBox" class="feedback">
    <div id="feedbackText"></div>
  </div>


  <!-- =========================
       FINE
  ========================== -->

  <div id="finishedBox" class="finished">

    <div class="finished-title">
      🎉 Bravissimo!
    </div>

    <div class="finished-text">
      Hai completato la conversazione al bar.
    </div>

  </div>


</div>


<script>


/* ==================================================
   RICONOSCIMENTO VOCALE
================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* ==================================================
   ELEMENTI DELLA PAGINA
================================================== */

const baristaBox =
  document.getElementById("baristaBox");

const baristaFace =
  document.getElementById("baristaFace");

const baristaSpeech =
  document.getElementById("baristaSpeech");

const studentBox =
  document.getElementById("studentBox");

const studentText =
  document.getElementById("studentText");

const speakButton =
  document.getElementById("speakButton");

const listenButton =
  document.getElementById("listenButton");

const nextButton =
  document.getElementById("nextButton");

const statusBox =
  document.getElementById("status");

const feedbackBox =
  document.getElementById("feedbackBox");

const feedbackText =
  document.getElementById("feedbackText");

const counter =
  document.getElementById("counter");

const finishedBox =
  document.getElementById("finishedBox");


/* ==================================================
   CONVERSAZIONE
================================================== */

const conversation = [

  {
    barista: "Buongiorno! Cosa desidera?",
    feedback: "Bene! Hai risposto al barista. 👍"
  },

  {
    barista: "Certo! Desidera anche qualcosa da mangiare?",
    feedback: "Molto bene! Il barista continua la conversazione. 👍"
  },

  {
    barista: "Preferisce un cornetto alla crema o alla marmellata?",
    feedback: "Perfetto! Ora puoi scegliere. 👍"
  },

  {
    barista: "Va bene. Sono 3 euro, per favore.",
    feedback: "Benissimo! Il barista ti dice il prezzo. 💶"
  },

  {
    barista: "Grazie! Buona giornata!",
    feedback: "Conversazione completata! 🎉"
  }

];


/* ==================================================
   STATO
================================================== */

let currentTurn = 0;

let currentBaristaSpeech =
  conversation[0].barista;


/* ==================================================
   SINTESI VOCALE
================================================== */

function speakText(text) {

  if (!("speechSynthesis" in window)) {

    statusBox.innerText =
      "La sintesi vocale non è disponibile.";

    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "it-IT";

  utterance.rate = 0.9;

  utterance.pitch = 1;

  window.speechSynthesis.speak(utterance);
}


/* ==================================================
   ASCOLTA IL BARISTA
================================================== */

listenButton.addEventListener("click", function() {

  speakText(currentBaristaSpeech);

});


/* ==================================================
   CAMBIO SCHERMATA / TURNO
================================================== */

function showNewBaristaTurn() {

  /* Piccola animazione */

  baristaBox.classList.remove("new-turn");

  void baristaBox.offsetWidth;

  baristaBox.classList.add("new-turn");


  /* Aggiorna il testo */

  currentBaristaSpeech =
    conversation[currentTurn].barista;

  baristaSpeech.innerText =
    currentBaristaSpeech;


  /* Faccia del barista */

  baristaFace.innerText =
    "😊";


  /* Aggiorna numero turno */

  counter.innerText =
    "Turno " +
    (currentTurn + 1) +
    " di " +
    conversation.length;


  /* Prepara lo studente */

  studentBox.classList.add("ready");

  studentText.innerText =
    "Rispondi al barista.";


  /* Messaggio molto evidente */

  statusBox.innerText =
    "💬 Ora tocca a te!";


  /* Nasconde il vecchio feedback */

  feedbackBox.style.display =
    "none";


  /* Riattiva PARLA */

  speakButton.disabled =
    false;
  
  /* Il barista parla automaticamente */

  setTimeout(function() {
    speakText(currentBaristaSpeech);
  }, 300);
  
}


/* ==================================================
   RICONOSCIMENTO VOCALE
================================================== */

if (!SpeechRecognition) {

  speakButton.disabled = true;

  statusBox.innerText =
    "Il riconoscimento vocale non è disponibile su questo browser.";

} else {

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "it-IT";

  recognition.interimResults =
    false;

  recognition.continuous =
    false;


  /* ----------------------------------------------
     INIZIO ASCOLTO
  ---------------------------------------------- */

  recognition.onstart = function() {

    statusBox.innerText =
      "🎤 Sto ascoltando... Parla adesso.";

    speakButton.disabled =
      true;

    feedbackBox.style.display =
      "none";

    studentBox.classList.remove("ready");

  };


  /* ----------------------------------------------
     RISPOSTA DELLO STUDENTE
  ---------------------------------------------- */

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript.trim();


    /* Se non abbiamo ricevuto testo */

    if (text === "") {

      statusBox.innerText =
        "Non ho sentito. Prova ancora.";

      speakButton.disabled =
        false;

      studentBox.classList.add("ready");

      return;
    }


    /* Mostra quello che ha detto */

    studentText.innerText =
      "« " + text + " »";


    statusBox.innerText =
      "✅ Risposta ricevuta";


    /* Feedback */

    feedbackText.innerText =
      conversation[currentTurn].feedback;

    feedbackBox.style.display =
      "block";


    /* ------------------------------------------
       PASSA AL TURNO SUCCESSIVO
    ------------------------------------------ */

    currentTurn++;


    /* ------------------------------------------
       CI SONO ALTRE DOMANDE
    ------------------------------------------ */

    if (currentTurn < conversation.length) {

      /*
       * Aspettiamo un momento.
       * Così lo studente vede chiaramente
       * che la conversazione è cambiata.
       */

      speakButton.disabled =
        true;

      statusBox.innerText =
        "💬 Il barista sta rispondendo...";


      setTimeout(function() {

        showNewBaristaTurn();

      }, 700);


    }


    /* ------------------------------------------
       FINE CONVERSAZIONE
    ------------------------------------------ */

    else {

      setTimeout(function() {

        baristaFace.innerText =
          "😊";

        baristaSpeech.innerText =
          "Grazie! Buona giornata!";

        currentBaristaSpeech =
          "Grazie! Buona giornata!";

        counter.innerText =
          "🎉 Conversazione completata";

        statusBox.innerText =
          "Hai finito la conversazione!";

        studentText.innerText =
          "Bravissimo!";

        studentBox.classList.remove("ready");

        finishedBox.style.display =
          "block";

        speakButton.disabled =
          true;

        nextButton.style.display =
          "inline-block";

      }, 700);

    }

  };


  /* ----------------------------------------------
     ERRORI
  ---------------------------------------------- */

  recognition.onerror = function(event) {

    console.log(event.error);


    if (event.error === "not-allowed") {

      statusBox.innerText =
        "⚠️ Devi permettere l'accesso al microfono.";

    }

    else if (event.error === "no-speech") {

      statusBox.innerText =
        "Non ho sentito. Prova a parlare di nuovo.";

    }

    else {

      statusBox.innerText =
        "Si è verificato un problema. Prova ancora.";

    }


    speakButton.disabled =
      false;

    studentBox.classList.add("ready");

  };


  /* ----------------------------------------------
     FINE ASCOLTO
  ---------------------------------------------- */

  recognition.onend = function() {

    if (currentTurn < conversation.length) {

      speakButton.disabled =
        false;

    }

  };


  /* ----------------------------------------------
     PULSANTE PARLA
  ---------------------------------------------- */

  speakButton.addEventListener("click", function() {

    feedbackBox.style.display =
      "none";

    statusBox.innerText =
      "🎤 Preparati a parlare...";

    try {

      recognition.start();

    } catch (error) {

      console.log(error);

    }

  });

}


/* ==================================================
   RICOMINCIA
================================================== */

nextButton.addEventListener("click", function() {

  currentTurn = 0;

  currentBaristaSpeech =
    conversation[0].barista;


  /* Barista */

  baristaFace.innerText =
    "😊";

  baristaSpeech.innerText =
    currentBaristaSpeech;


  /* Studente */

  studentText.innerText =
    "Rispondi al barista.";

  studentBox.classList.add("ready");


  /* Turno */

  counter.innerText =
    "Turno 1 di " +
    conversation.length;


  /* Stato */

  statusBox.innerText =
    "💬 Ora tocca a te!";


  /* Feedback */

  feedbackBox.style.display =
    "none";


  /* Fine */

  finishedBox.style.display =
    "none";


  /* Pulsanti */

  nextButton.style.display =
    "none";

  speakButton.disabled =
    false;

});


</script>

</body>
</html>
