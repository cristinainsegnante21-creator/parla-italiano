<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parla Italiano - Al bar</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ec;
      color: #333;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #5b351c;
      font-size: 32px;
      margin: 5px 0;
    }

    .subtitle {
      color: #666;
      font-size: 18px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .barista {
      text-align: center;
    }

    .face {
      font-size: 60px;
      margin-bottom: 8px;
    }

    .speaker {
      font-weight: bold;
      color: #8a4b20;
      margin-bottom: 12px;
    }

    .speech {
      font-size: 24px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }

    .listen {
      background: #3978b8;
      color: white;
    }

    .speak {
      background: #287a4b;
      color: white;
      font-size: 23px;
    }

    .help {
      background: #f0d36a;
      color: #493d00;
    }

    .status {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      min-height: 30px;
      margin: 12px 0;
    }

    .student {
      display: none;
      background: #e5f3e9;
      border-radius: 18px;
      padding: 18px;
    }

    .student-title {
      color: #287a4b;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #transcript {
      font-size: 21px;
      line-height: 1.4;
    }

    .helpBox {
      display: none;
      background: #fff8d9;
      border-radius: 18px;
      padding: 18px;
      margin-top: 15px;
    }

    .helpText {
      font-size: 20px;
      line-height: 1.4;
    }

    .feedback {
      display: none;
      border-radius: 18px;
      padding: 18px;
      margin-top: 15px;
      background: #ffffff;
    }

    .feedbackTitle {
      font-weight: bold;
      color: #8a4b20;
      margin-bottom: 10px;
    }

    .small {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-top: 25px;
      margin-bottom: 20px;
    }

  </style>
</head>

<body>

<div class="app">

  <header>

    <div style="font-size:48px;">☕</div>

    <h1>AL BAR</h1>

    <div class="subtitle">
      Parla italiano!
    </div>

  </header>


  <!-- BARISTA -->

  <div class="card barista">

    <div class="face" id="baristaFace">
      😊
    </div>

    <div class="speaker">
      BARISTA
    </div>

    <div class="speech" id="baristaSpeech">
      Buongiorno! Cosa desidera?
    </div>

    <button
      class="listen"
      onclick="speakText(currentBaristaSpeech)">
      🔊 ASCOLTA
    </button>

  </div>


  <!-- STATO -->

  <div class="status" id="status">
    Tocca PARLA e prova a rispondere.
  </div>


  <!-- PARLA -->

  <button
    class="speak"
    id="speakButton">
    🎙️ PARLA
  </button>


  <!-- RISPOSTA STUDENTE -->

  <div
    class="student"
    id="studentBox">

    <div class="student-title">
      🗣️ HAI DETTO:
    </div>

    <div id="transcript"></div>

  </div>


  <!-- AIUTO -->

  <div
    class="helpBox"
    id="helpBox">

    <div class="helpText">

      💡 <strong>Puoi dire:</strong>

      <br><br>

      <span id="helpText">
        Vorrei un caffè, per favore.
      </span>

    </div>

    <button
      class="listen"
      onclick="speakText(currentHelpText)">

      🔊 ASCOLTA LA FRASE

    </button>

  </div>


  <button
    class="help"
    id="helpButton"
    style="display:none;">

    🆘 AIUTO

  </button>


  <!-- FEEDBACK -->

  <div
    class="feedback"
    id="feedbackBox">

    <div class="feedbackTitle">
      💬 Piccolo aiuto
    </div>

    <div id="feedbackText"></div>

  </div>


  <div class="small">

    Non preoccuparti degli errori 😊<br>
    Prova a parlare!

  </div>

</div>


<script>


/* ============================
   VARIABILI
============================ */

let currentBaristaSpeech =
  "Buongiorno! Cosa desidera?";

let currentHelpText =
  "Vorrei un caffè, per favore.";


/* ============================
   SINTESI VOCALE
============================ */

function speakText(text) {

  if (!("speechSynthesis" in window)) {

    alert(
      "La sintesi vocale non è disponibile su questo dispositivo."
    );

    return;
  }

  window.speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(text);

  voice.lang = "it-IT";

  /* leggermente più lenta */

  voice.rate = 0.85;

  voice.pitch = 1;

  window.speechSynthesis.speak(voice);
}


/* ============================
   ELEMENTI
============================ */

const speakButton =
  document.getElementById("speakButton");

const status =
  document.getElementById("status");

const studentBox =
  document.getElementById("studentBox");

const transcript =
  document.getElementById("transcript");

const helpButton =
  document.getElementById("helpButton");

const helpBox =
  document.getElementById("helpBox");

const feedbackBox =
  document.getElementById("feedbackBox");

const feedbackText =
  document.getElementById("feedbackText");

const baristaFace =
  document.getElementById("baristaFace");

const baristaSpeech =
  document.getElementById("baristaSpeech");


/* ============================
   RICONOSCIMENTO VOCALE
============================ */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  status.innerHTML =
    "⚠️ Il riconoscimento vocale non è disponibile.";

  speakButton.disabled = true;

  speakButton.style.background = "#999";

} else {

  const recognition =
    new SpeechRecognition();

  recognition.lang = "it-IT";

  recognition.interimResults = false;

  recognition.continuous = false;


  speakButton.addEventListener(
    "click",
    () => {

      studentBox.style.display = "none";

      helpButton.style.display = "none";

      helpBox.style.display = "none";

      feedbackBox.style.display = "none";

      status.innerHTML =
        "🔴 Ti ascolto...";

      speakButton.innerHTML =
        "🔴 STO ASCOLTANDO";

      try {

        recognition.start();

      } catch (error) {

        console.log(error);

      }

    }
  );


  /* ============================
     RISULTATO
  ============================ */

  recognition.onresult =
    (event) => {

      const text =
        event.results[0][0].transcript;

      transcript.innerText =
        text;

      studentBox.style.display =
        "block";

      speakButton.innerHTML =
        "🎙️ PARLA DI NUOVO";

      status.innerHTML =
        "✅ Hai parlato!";

      /*
       * L'AIUTO compare SOLO
       * dopo che lo studente
       * ha parlato.
       */

      helpButton.style.display =
        "block";


      /*
       * Per ora simuliamo
       * la risposta del barista.
       */

      analyseResponse(text);

    };


  /* ============================
     ERRORI
  ============================ */

  recognition.onerror =
    (event) => {

      console.log(event.error);

      if (
        event.error ===
        "not-allowed"
      ) {

        status.innerHTML =
          "⚠️ Controlla il permesso del microfono.";

      } else if (
        event.error ===
        "no-speech"
      ) {

        status.innerHTML =
          "👂 Non ho sentito. Prova ancora.";

      } else {

        status.innerHTML =
          "❌ Non ho sentito. Prova ancora.";

      }

      speakButton.innerHTML =
        "🎙️ PARLA";

    };


  recognition.onend =
    () => {

      speakButton.innerHTML =
        "🎙️ PARLA";

    };

}


/* ============================
   SIMULAZIONE DEL BARISTA
============================ */

function analyseResponse(text) {

  helpButton.style.display = "none";
  helpBox.style.display = "none";

  const lower =
    text.toLowerCase();


  /*
   * Alcune parole che indicano
   * una richiesta comprensibile.
   */

  const understoodWords = [
    "caffè",
    "cappuccino",
    "cornetto",
    "acqua",
    "latte",
    "tè",
    "the",
    "vorrei",
    "prendo",
    "voglio",
    "desidero"
  ];


  let understood = false;


  for (
    let i = 0;
    i < understoodWords.length;
    i++
  ) {

    if (
      lower.includes(
        understoodWords[i]
      )
    ) {

      understood = true;

      break;

    }

  }


  /*
   * Se capisce:
   */

  if (understood) {

    baristaFace.innerHTML =
      "😊";

    currentBaristaSpeech =
      "Certo! Ecco a lei. Desidera anche qualcosa da mangiare?";

    baristaSpeech.innerText =
      currentBaristaSpeech;

    feedbackText.innerHTML =
      "Bene! Il barista ha capito. 👍";

    feedbackBox.style.display =
      "block";


    currentHelpText =
      "Sì, vorrei anche un cornetto, per favore.";

  }


  /*
   * Se non capisce:
   */

  else {

    baristaFace.innerHTML =
      "🤔";

    currentBaristaSpeech =
      "Mi scusi, non ho capito. Può ripetere, per favore?";

    baristaSpeech.innerText =
      currentBaristaSpeech;

    feedbackText.innerHTML =
      "Prova a ripetere la frase con calma.";

    feedbackBox.style.display =
      "block";


    currentHelpText =
      "Vorrei un caffè, per favore.";

  }

}


/* ============================
   PULSANTE AIUTO
============================ */

helpButton.addEventListener(
  "click",
  () => {

    if (
      helpBox.style.display ===
      "block"
    ) {

      helpBox.style.display =
        "none";

    } else {

      /*
       * L'aiuto mostra una frase
       * diversa a seconda della
       * situazione.
       */

      document.getElementById(
        "helpText"
      ).innerText =
        currentHelpText;

      helpBox.style.display =
        "block";

    }

  }
);

</script>

</body>
</html>
