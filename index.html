<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Al Bar - Parla Italiano</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f1e8;
  margin: 0;
  padding: 0;
  color: #333;
}

header {
  background: #6f4e37;
  color: white;
  text-align: center;
  padding: 18px;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 6px 0 0;
  font-size: 15px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.barista {
  background: white;
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.face {
  font-size: 70px;
}

.label {
  font-size: 13px;
  color: #777;
  margin-bottom: 8px;
}

.barista-speech {
  font-size: 22px;
  line-height: 1.4;
  margin: 10px 0 15px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 15px 20px;
  font-size: 18px;
  cursor: pointer;
}

.listen {
  background: #eee;
  color: #333;
}

.speak {
  width: 100%;
  margin-top: 20px;
  background: #2e7d32;
  color: white;
  font-weight: bold;
}

.status {
  text-align: center;
  margin: 15px 0;
  font-size: 16px;
}

.student-box {
  background: white;
  border-radius: 15px;
  padding: 15px;
  margin-top: 15px;
  display: none;
}

.student-title {
  font-size: 13px;
  color: #777;
  margin-bottom: 5px;
}

.student-text {
  font-size: 20px;
}

.help-button {
  width: 100%;
  margin-top: 15px;
  background: #ff9800;
  color: white;
  font-weight: bold;
  display: none;
}

.help-box {
  background: #fff3cd;
  border-radius: 15px;
  padding: 15px;
  margin-top: 10px;
  display: none;
}

.help-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.help-text {
  font-size: 20px;
  margin-bottom: 12px;
}

.feedback {
  background: white;
  border-radius: 15px;
  padding: 15px;
  margin-top: 15px;
  display: none;
}

</style>

</head>

<body>

<header>

  <h1>☕ AL BAR</h1>

  <p>Parla italiano</p>

</header>


<div class="container">


  <!-- ============================
       BARISTA
  ============================ -->

  <div class="barista">

    <div
      id="baristaFace"
      class="face">
      😊
    </div>

    <div class="label">
      BARISTA
    </div>

    <div
      id="baristaSpeech"
      class="barista-speech">
      Buongiorno! Cosa desidera?
    </div>

    <button
      id="listenButton"
      class="listen">

      🔊 ASCOLTA

    </button>

  </div>


  <!-- ============================
       STATO
  ============================ -->

  <div
    id="status"
    class="status">

    Tocca PARLA e rispondi al barista.

  </div>


  <!-- ============================
       RISPOSTA STUDENTE
  ============================ -->

  <div
    id="studentBox"
    class="student-box">

    <div class="student-title">
      HAI DETTO:
    </div>

    <div
      id="transcript"
      class="student-text">
    </div>

  </div>


  <!-- ============================
       AIUTO
  ============================ -->

  <button
    id="helpButton"
    class="help-button">

    🆘 AIUTO

  </button>


  <div
    id="helpBox"
    class="help-box">

    <div class="help-title">
      💡 Puoi dire:
    </div>

    <div
      id="helpText"
      class="help-text">
    </div>

    <button
      id="helpListenButton"
      class="listen">

      🔊 ASCOLTA LA FRASE

    </button>

  </div>


  <!-- ============================
       FEEDBACK
  ============================ -->

  <div
    id="feedbackBox"
    class="feedback">

    <div id="feedbackText"></div>

  </div>


  <!-- ============================
       PARLA
  ============================ -->

  <button
    id="speakButton"
    class="speak">

    🎙️ PARLA

  </button>


</div>


<script>


/* ============================
   ELEMENTI
============================ */

const baristaFace =
  document.getElementById("baristaFace");

const baristaSpeech =
  document.getElementById("baristaSpeech");

const listenButton =
  document.getElementById("listenButton");

const speakButton =
  document.getElementById("speakButton");

const status =
  document.getElementById("status");

const studentBox =
  document.getElementById("studentBox");

const transcript =
  document.getElementById("transcript");

const helpButton =
  document.getElementById("helpButton");

const helpBox =
  document.getElementById("helpBox");

const helpText =
  document.getElementById("helpText");

const helpListenButton =
  document.getElementById("helpListenButton");

const feedbackBox =
  document.getElementById("feedbackBox");

const feedbackText =
  document.getElementById("feedbackText");


/* ============================
   VARIABILI
============================ */

let currentBaristaSpeech =
  "Buongiorno! Cosa desidera?";

let currentHelpText =
  "Vorrei un caffè, per favore.";


/* ============================
   SINTESI VOCALE
============================ */

function speakText(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    "it-IT";

  utterance.rate =
    0.85;

  speechSynthesis.speak(
    utterance
  );

}


/* ============================
   ASCOLTA BARISTA
============================ */

listenButton.addEventListener(
  "click",
  () => {

    speakText(
      currentBaristaSpeech
    );

  }
);


/* ============================
   ASCOLTA AIUTO
============================ */

helpListenButton.addEventListener(
  "click",
  () => {

    speakText(
      currentHelpText
    );

  }
);


/* ============================
   RICONOSCIMENTO VOCALE
============================ */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  status.innerHTML =
    "⚠️ Il riconoscimento vocale non è disponibile.";

  speakButton.disabled =
    true;

  speakButton.style.background =
    "#999";

} else {

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "it-IT";

  recognition.interimResults =
    false;

  recognition.continuous =
    false;


  /* ============================
     QUANDO LO STUDENTE PREME PARLA
  ============================ */

  speakButton.addEventListener(
    "click",
    () => {

      /* Nascondiamo l'aiuto
         del turno precedente */

      helpButton.style.display =
        "none";

      helpBox.style.display =
        "none";

      feedbackBox.style.display =
        "none";

      studentBox.style.display =
        "none";

      status.innerHTML =
        "🔴 Ti ascolto...";

      speakButton.innerHTML =
        "🔴 STO ASCOLTANDO";

      try {

        recognition.start();

      } catch (error) {

        console.log(error);

      }

    }
  );


  /* ============================
     RISULTATO
  ============================ */

  recognition.onresult =
    (event) => {

      const text =
        event.results[0][0].transcript;

      transcript.innerText =
        text;

      studentBox.style.display =
        "block";

      speakButton.innerHTML =
      "🎙️ PARLA DI NUOVO";

      status.innerHTML =
        "✅ Hai parlato!";

     /*
     * Lo studente ha parlato.
     * Ora analizziamo la risposta.
     */

      analyseResponse(text);

    };


  /* ============================
     ERRORI
  ============================ */

  recognition.onerror =
    (event) => {

      console.log(
        event.error
      );

      if (
        event.error ===
        "not-allowed"
      ) {

        status.innerHTML =
          "⚠️ Controlla il permesso del microfono.";

      } else if (
        event.error ===
        "no-speech"
      ) {

        status.innerHTML =
          "👂 Non ho sentito. Prova ancora.";

      } else {

        status.innerHTML =
          "❌ Non ho sentito. Prova ancora.";

      }

      speakButton.innerHTML =
        "🎙️ PARLA";

    };


  recognition.onend =
    () => {

      speakButton.innerHTML =
        "🎙️ PARLA";

    };

}


/* ============================
   SIMULAZIONE DEL BARISTA
============================ */

function analyseResponse(text) {

   /*
   * Quando il barista risponde,
   * l'aiuto deve essere nascosto.
   */

  helpButton.style.display =
    "none";

  helpBox.style.display =
    "none";
      
  const lower =
    text.toLowerCase();


  /* Parole che indicano
     una richiesta comprensibile */

  const understoodWords = [

    "caffè",
    "cappuccino",
    "cornetto",
    "acqua",
    "latte",
    "tè",
    "the",
    "vorrei",
    "prendo",
    "voglio",
    "desidero"

  ];


  let understood =
    false;


  for (
    let i = 0;
    i < understoodWords.length;
    i++
  ) {

    if (
      lower.includes(
        understoodWords[i]
      )
    ) {

      understood =
        true;

      break;

    }

  }


  /* ============================
     BARISTA CAPISCE
  ============================ */

  if (understood) {

    baristaFace.innerHTML =
      "😊";

    currentBaristaSpeech =
      "Certo! Ecco a lei. Desidera anche qualcosa da mangiare?";

    baristaSpeech.innerText =
      currentBaristaSpeech;

    feedbackText.innerHTML =
      "Bene! Il barista ha capito. 👍";

    feedbackBox.style.display =
      "block";

    currentHelpText =
      "Sì, vorrei anche un cornetto, per favore.";

  }


  /* ============================
     BARISTA NON CAPISCE
  ============================ */

  else {

    baristaFace.innerHTML =
      "🤔";

    currentBaristaSpeech =
      "Mi scusi, non ho capito. Può ripetere, per favore?";

    baristaSpeech.innerText =
      currentBaristaSpeech;

    feedbackText.innerHTML =
      "Prova a ripetere la frase con calma.";

    feedbackBox.style.display =
      "block";

    currentHelpText =
      "Vorrei un caffè, per favore.";

  }


  /*
   * IMPORTANTE:
   * l'aiuto compare SOLO
   * dopo che il barista
   * ha preparato la risposta.
   */

  setTimeout(
    () => {

      helpButton.style.display =
        "block";

    },
    300
  );

}


/* ============================
   PULSANTE AIUTO
============================ */

helpButton.addEventListener(
  "click",
  () => {

    helpText.innerText =
      currentHelpText;

    helpBox.style.display =
      "block";

  }
);


</script>

</body>

</html>
